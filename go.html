</head><body><main class="box"><img src="/cjhq-logo.png" alt="CJHQ"><h1 id="title">Opening your link...</h1><p id="message">Please wait a moment.</p><p id="manual"></p><noscript>JavaScript is needed to open this link.</noscript></main>
<script type="module">
const title=document.getElementById('title'),message=document.getElementById('message');
function unavailable(text='This link may have been removed or deactivated.'){title.textContent='Link not available';message.textContent=text;}
const slug=new URLSearchParams(location.search).get('l')||'';
if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)||slug.length>61){unavailable();}else{
try{
  const {initializeApp}=await import('https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js');
  const {getFirestore,doc,getDoc}=await import('https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-lite.js');
  const app=initializeApp({apiKey:'AIzaSyDPzTFbsiOtJ4LOKiFjL0aVtSKhl21zwuc',authDomain:'cjhqinfo.firebaseapp.com',projectId:'cjhqinfo',appId:'1:158970385688:web:c9bdc737f4e123b69aba6d'});
  const snap=await getDoc(doc(getFirestore(app),'forward_links',slug));
  if(!snap.exists()||snap.data().active!==true){unavailable();}else{
    const u=new URL(snap.data().destination);
    if(!['http:','https:'].includes(u.protocol)||u.username||u.password||(['cjhq.org','www.cjhq.org'].includes(u.hostname)&&/^\/go(?:\.html|\/.*)?\/?$/.test(u.pathname)))throw new Error('invalid destination');
    const a=document.createElement('a');a.href=u.href;a.textContent='Open it here if nothing happens';a.rel='noreferrer';document.getElementById('manual').append(a);
    message.textContent='Taking you to the shared destination.';
    let gone=false;const go=()=>{if(!gone){gone=true;location.replace(u.href);}};
    gtag('event','page_view',{page_path:'/go?l='+encodeURIComponent(slug),page_location:location.origin+'/go?l='+encodeURIComponent(slug),event_callback:go,event_timeout:700});setTimeout(go,1600);
  }
}catch(e){unavailable('This link is unavailable right now. Please check the address or try again later.');}
}
</script></body></html>

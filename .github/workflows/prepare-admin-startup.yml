name: Prepare admin startup review
on:
  push:
    branches: [fix/admin-startup-2026-10-04]
    paths: [.github/workflows/prepare-admin-startup.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate tested admin-only repair
        env:
          PATCH_GZ: 
        run: |
          python3 - <<'PY'
          import os,base64,gzip
          from pathlib import Path
          Path('/tmp/startup.patch').write_bytes(gzip.decompress(base64.b64decode(os.environ['PATCH_GZ'])))
          PY
          git apply --check /tmp/startup.patch
          git apply /tmp/startup.patch
          git restore .github/workflows/ask-backend-ci.yml
          npm ci --ignore-scripts --no-audit --no-fund
          node tools/generate-routes.mjs
          git diff --name-only | grep -E '(^fr/|^resources/|\.html$)' | grep -v '^admin.html$' | while IFS= read -r file; do git restore -- "$file"; done
          node tools/minify-routes.mjs --changed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html tests/browser-admin-startup.cjs
          git commit -m "Generate admin-only startup repair and regression coverage"
          git push

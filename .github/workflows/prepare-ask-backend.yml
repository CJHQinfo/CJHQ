name: Prepare Ask backend review branch
on:
  push:
    branches: [review/ask-backend-2026-10-04]
    paths: [.github/workflows/prepare-ask-backend.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested admin-only patch to review branch
        env:
          PATCH_GZ: 
        run: |
          python3 - <<'PY'
          import os,base64,gzip
          from pathlib import Path
          Path('/tmp/ask.patch').write_bytes(gzip.decompress(base64.b64decode(os.environ['PATCH_GZ'])))
          PY
          git apply --check /tmp/ask.patch
          git apply /tmp/ask.patch
          npm ci --ignore-scripts --no-audit --no-fund
          node tools/sync-ask-core.mjs
          node tools/generate-routes.mjs
          git diff --name-only | grep -E '(^fr/|^resources/|\.html$)' | grep -v '^admin.html$' | while IFS= read -r file; do git restore -- "$file"; done
          node tools/minify-routes.mjs --changed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html ask-core.mjs package.json tests tools .github/workflows/ask-backend-ci.yml
          git commit -m "Build admin-only Ask CJHQ review release"
          test "$(git branch --show-current)" = "review/ask-backend-2026-10-04"
          git push origin HEAD:review/ask-backend-2026-10-04

name: Generate per-page share previews

# Why this exists
# ---------------
# notice.html gives every admin-created temporary page one generic preview
# card. This regenerates a real static file per live page (notice/<slug>.html,
# plus its card image) so each page's share link previews with its own
# headline. See tools/generate-notice-pages.py for the access model - it reads
# Firestore with the site's public web key, exactly like an anonymous visitor,
# so no secrets are stored and unpublished/expired pages are never exposed.

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # every 15 min; a newly published page previews within ~15-30 min
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notice-pages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow and the DejaVu fonts the cards are set in
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu
          pip install pillow

      - name: Generate per-page notice files
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tools/generate-notice-pages.py

      - name: Commit regenerated notice pages
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # notice/, assets/ and the baked top-level /<slug>/ pages (the
          # script only ever writes or deletes its own marked files).
          git add -A -- . ':!**/__pycache__'
          if git diff --staged --quiet; then
            echo "Notice pages already up to date - nothing to commit."
          else
            git commit -m "chore: regenerate per-page share previews"
            git push
          fi

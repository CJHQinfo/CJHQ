name: Generate static route files

# Why this exists
# ---------------
# GitHub Pages cannot rewrite URLs. Without a real file at /resources the server
# answers HTTP 404, serves 404.html and lets JavaScript recover. Visitors do not
# notice; crawlers do, and generally will not index a URL that answers 404.
#
# This regenerates one static file per route whenever index.html changes, so the
# only file anyone has to upload by hand is still index.html.
#
# It never edits index.html and never touches page content: the generator copies
# index.html and rewrites only the <head> metadata, reading the values from the
# PAGE_META object already inside the file.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tools/generate-routes.mjs'
      - '.github/workflows/generate-routes.yml'
  workflow_dispatch:

permissions:
  contents: write

# If two pushes land close together, let the newer one win rather than racing.
concurrency:
  group: generate-routes
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate route files from index.html
        run: node tools/generate-routes.mjs

      - name: Commit regenerated routes
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources.html stay-informed.html contact.html about.html \
                  privacy.html terms.html accessibility.html
          if git diff --staged --quiet; then
            echo "Route files already up to date - nothing to commit."
          else
            git commit -m "chore: regenerate static route files from index.html"
            git push
          fi

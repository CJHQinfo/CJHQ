name: Generate static route files

# Why this exists
# ---------------
# GitHub Pages cannot rewrite URLs. Without a real file at /resources the server
# answers HTTP 404, serves 404.html and lets JavaScript recover. Visitors do not
# notice; crawlers do, and generally will not index a URL that answers 404.
#
# This regenerates one static file per route whenever index.html changes, so the
# only file anyone has to upload by hand is still index.html.
#
# It never edits index.html and never touches page content: the generator copies
# index.html and rewrites only the <head> metadata, reading the values from the
# PAGE_META object already inside the file.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tools/generate-routes.mjs'
      - '.github/workflows/generate-routes.yml'
  workflow_dispatch:

permissions:
  contents: write

# If two pushes land close together, let the newer one win rather than racing.
concurrency:
  group: generate-routes
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fails the run before anything is regenerated or committed. ask-core.mjs
      # and ask-data.mjs are generated from index.html and are imported by the
      # external WhatsApp bridge, so if an index.html edit leaves them stale the
      # bridge would answer from a different engine than the website. Failing
      # here is the point: a red run is recoverable, silent drift between the
      # two callers is not.
      #
      # To fix a failure: run `node tools/sync-ask-core.mjs` locally and commit
      # the regenerated modules alongside the index.html change.
      - name: Verify the shared Ask CJHQ core is in sync with index.html
        run: node tools/sync-ask-core.mjs --check

      - name: Install build dependencies
        run: npm ci

      - name: Generate route files from index.html
        run: node tools/generate-routes.mjs

      - name: Minify generated copies
        run: node tools/minify-routes.mjs --changed

      - name: Verify generated artifacts are in sync
        run: node tools/generate-routes.mjs --check

      - name: Commit regenerated routes
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The generator writes eight English routes, admin.html, and nine
          # French routes. Stage them all so a change to index.html cannot
          # leave French copies drifting in the published tree.
          git add resources.html stay-informed.html contact.html about.html \
                  privacy.html terms.html accessibility.html \
                  child-travel-consent.html admin.html fr/index.html \
                  fr/ressources.html fr/actualites.html fr/a-propos.html \
                  fr/contact.html fr/politique-de-confidentialite.html \
                  fr/conditions-utilisation.html fr/accessibilite.html \
                  fr/consentement-voyage-enfant.html
          if git diff --staged --quiet; then
            echo "Route files already up to date - nothing to commit."
          else
            git commit -m "chore: regenerate static route files from index.html"
            git push
          fi
